name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server shellcheck
      - name: Shell scripts
        run: shellcheck -S warning install.sh scripts/*.sh
      - name: Tests (unit, handlers with a fake Telegram, real sshd)
        # Run as root so the throw-away sshd used by the tests can allocate PTYs like a real server.
        run: sudo env "PATH=$PATH" python -m pytest -q -p no:cacheprovider
